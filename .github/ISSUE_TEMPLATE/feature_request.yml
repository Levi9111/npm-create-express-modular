name: ✨ Feature Request
description: Suggest an idea or new template option for create-express-modular
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new database, ORM, validator, middleware generator, or CLI feature? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what problem or inconvenience this addresses.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Generated Architecture
      description: Describe what should be scaffolded or how the CLI should behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
