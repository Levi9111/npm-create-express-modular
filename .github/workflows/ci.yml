name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Build CLI (tsup)
        run: npm run build

      - name: Run CLI integration tests
        run: npm test

  e2e-scaffold-verification:
    name: E2E Scaffolding & Verification
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install CEM dependencies
        run: npm install

      - name: Build CEM CLI
        run: npm run build

      - name: Scaffold test project (Mongoose + Zod + Swagger + Auth)
        run: |
          node dist/bin/cli.js e2e-test-project -y --db mongoose --validator zod --swagger --auth --docker

      - name: Install scaffolded project dependencies
        working-directory: e2e-test-project
        run: npm install

      - name: Link local CEM CLI to scaffolded project
        run: |
          cd e2e-test-project
          npm link ../

      - name: Verify scaffolded project type-check, lint, and format
        working-directory: e2e-test-project
        run: |
          npx eslint src
          npx prettier --check src
          npx tsc --noEmit

      - name: Test feature module generation
        working-directory: e2e-test-project
        run: |
          node ../dist/bin/cli.js add module Product -y
          node ../dist/bin/cli.js add middleware customLogger
          npx tsc --noEmit
